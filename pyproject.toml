[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarake-watcher"
version = "0.1.0"
description = "Monitor Mandarake for new listings matching configured keywords."
requires-python = ">=3.10"


dependencies = [
    "playwright",
    "beautifulsoup4",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]